<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500|Roboto:300,400,500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <title>30 Days Of React App</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        line-height: 1.5;
        font-family: "Montserrat";
        font-weight: 300;
        color: black;
        display: flex;
        flex-direction: column;
      }

      .root {
        flex: 1; /* pushes footer to bottom */
        display: flex;
        flex-direction: column;
      }

      .header-wrapper,
      .main-wrapper,
      .footer-wrapper {
        width: 85%;
        margin: auto;
      }

      .header-wrapper,
      .main-wrapper {
        padding: 10px;
        margin: 2px auto;
      }

      h1 {
        font-size: 70px;
        font-weight: 300;
      }

      h2,
      h3 {
        font-weight: 300;
      }

      header {
        background-color: #61dbfb;
        padding: 10px;
      }

      main {
        flex: 1; /* takes remaining space */
        padding: 10px;
      }

      ul {
        margin-left: 15px;
      }

      ul li {
        list-style: none;
      }

      footer {
        height: 60px;
        background: #6cf;
      }

      .footer-wrapper {
        font-weight: 400;
        text-align: center;
        line-height: 60px;
      }

      .user-card {
        margin-top: 10px;
      }
      .user-card > img {
        border-radius: 50%;
        width: 14%;
      }

      .countries-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
      }

      .countries-wrapper > div {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .countries-wrapper > div:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }

      .countries-wrapper img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-bottom: 1px solid #eee;
      }

      .countries-wrapper h1 {
        font-size: 1.4rem;
        margin: 10px 0;
        color: #333;
      }

      .countries-wrapper p {
        font-size: 0.95rem;
        margin: 4px 0;
        color: #555;
      }

      .countries-wrapper > div > div:last-child {
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
